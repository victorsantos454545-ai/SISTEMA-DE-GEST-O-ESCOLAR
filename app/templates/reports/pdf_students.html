<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatório de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Relatório de Alunos</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome Completo</th>
                <th>Data Nasc.</th>
                <th>Matrícula</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s.id }}</td>
                <td>{{ s.full_name }}</td>
                <td>{{ s.birth_date.strftime('%d/%m/%Y') if s.birth_date else '-' }}</td>
                <td>{{ s.cpf }}</td>
                <td>{{ s.status | capitalize }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
