{% macro render_stat_card(title, value, icon, bg_color='primary', url='#') %}
<div class="card bg-{{ bg_color }} text-white h-100 shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="card-title mb-0 text-uppercase fw-bold">{{ title }}</h6>
            <i class="bi bi-{{ icon }} fs-4 opacity-75"></i>
        </div>
        <h2 class="display-5 fw-bold mb-0">{{ value }}</h2>
    </div>
    {% if url and url != '#' %}
    <div class="card-footer bg-transparent border-top border-light border-opacity-25 py-2">
        <a href="{{ url }}" class="text-white text-decoration-none d-flex align-items-center justify-content-between">
            <span class="small">+ informações</span>
            <i class="bi bi-arrow-right"></i>
        </a>
    </div>
    {% endif %}
</div>
{% endmacro %}
