{% extends "base.html" %}

{% block title %}Editar Aluno{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-gray-800">
            <a href="{{ url_for('students.detail', student_id=student.id) }}" class="text-decoration-none text-muted me-2"><i class="bi bi-arrow-left"></i></a>
            Editar Aluno: {{ student.social_name or student.full_name }}
        </h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('students.edit', student_id=student.id) }}">
                {% include 'students/_form.html' %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
